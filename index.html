<!DOCTYPE html>
<html>

<head>
    <title>Eevee Pokemon Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <div class="top">
            <div class="basic">BASIC</div>
            <div class="name">Eevee</div>
            <div class="hp">HP 60 ★</div>
        </div>

        <div class="picture">
         <img src="eevee.png" alt="Eevee">
        </div>

        <div class="firstAttack">
            ★
            <span>Call for Family</span>

            <p>
                Search your deck for a Basic Pokemon and put it
                onto your Bench. Then, shuffle your deck.
            </p>
        </div>

        <div class="secondAttack">
            ★ ★ ★
            <span>Tackle</span>
            <div class="damage">30</div>
        </div>

        <div class="bottom">
            weakness ★ x2 &nbsp;&nbsp;
            resistance &nbsp;&nbsp;
            retreat ★
        </div>

    </div>

</body>

</html>
